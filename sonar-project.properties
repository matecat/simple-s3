# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud configuration for simple-s3
# ─────────────────────────────────────────────────────────────────────────────
sonar.organization=matecat
sonar.projectKey=matecat_simple-s3
sonar.projectName=simple-s3

# Source & test directories
sonar.sources=src
sonar.tests=tests

# Exclusions (vendor, build artifacts, etc.)
sonar.exclusions=vendor/**,benchmark/**,bin/**,log/**,config/**,.github/**,log/**

# PHP coverage – Clover XML produced by PHPUnit
sonar.php.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
